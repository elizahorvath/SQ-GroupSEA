name: JabberPoint SQ Pipeline

# Trigger the pipeline on every push and pull request to the main branch
on:
  push:
    branches:
      - develop
      - test
      - acceptance
      - main
  pull_request:
    branches:
      - main

jobs:
  # STAGE 1: Development
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile Project
        run: mvn -B compile

  # STAGE 2: Testing
  test:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B test

      - name: Generate JaCoCo Report
        run: mvn jacoco:report

  # STAGE 3: Acceptance
  acceptance:
    if: github.ref == 'refs/heads/acceptance'
    runs-on: ubuntu-latest
    environment: Acceptance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Full Verification
        run: mvn -B verify

      - name: Generate Coverage Report
        run: mvn jacoco:report

  # STAGE 4: Production
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package Application
        run: mvn -B package -DskipTests

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JabberPoint-Executable
          path: target/*.jar
